name: CivicPulse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, type-check, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TRIAGE_PROVIDER: simulated
      ENVIRONMENT: ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy app
      - name: Pytest with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65

  frontend:
    name: Frontend lint, type-check, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
      - name: Production build
        run: npm run build

  docker-scan:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build backend image
        run: docker build -t civicpulse-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci ./frontend
      - name: Trivy backend scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: civicpulse-backend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy frontend scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: civicpulse-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  integration:
    name: Compose integration smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_DB: civicpulse
      POSTGRES_USER: civicuser
      POSTGRES_PASSWORD: civicpass
      DATABASE_URL: postgresql+asyncpg://civicuser:civicpass@postgres:5432/civicpulse
      REDIS_URL: redis://redis:6379/0
      TRIAGE_PROVIDER: simulated
      GROQ_API_KEY: ""
      ENVIRONMENT: ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Start Compose stack
        run: docker compose up -d --build --remove-orphans
      - name: Show service state
        run: docker compose ps
      - name: Wait for backend readiness
        shell: bash
        run: |
          for i in {1..45}; do
            if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)" >/dev/null 2>&1; then
              echo "Backend is ready."
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend postgres redis
          exit 1
      - name: Apply database migrations
        run: docker compose exec -T backend alembic upgrade head
      - name: End-to-end API smoke test
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          BASE = "http://127.0.0.1:8080"

          def request(method, path, payload=None):
              data = None
              headers = {}
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              return urllib.request.urlopen(req, timeout=10)

          payload = {
              "text": "Burst water main flooding the street since fajr and entering two houses.",
              "location": "Street 12, Block C",
          }

          with request("POST", "/api/complaints", payload) as resp:
              assert resp.status == 201
              created = json.load(resp)

          complaint_id = created["id"]

          assert created["status"] == "open"
          assert created["category"] in {
              "water",
              "electricity",
              "sanitation",
              "roads",
              "streetlights",
              "other",
          }
          assert created["priority"] in {"high", "normal", "low"}
          assert created["ai_summary"]
          assert created["triaged_by"] == "simulated"

          with request("GET", f"/api/complaints/{complaint_id}") as resp:
              assert resp.status == 200
              fetched = json.load(resp)

          assert fetched["id"] == complaint_id

          def get_stats():
              req = urllib.request.Request(BASE + "/api/stats", method="GET")
              with urllib.request.urlopen(req, timeout=10) as resp:
                  return resp.headers.get("X-Cache"), json.load(resp)

          first_cache, first_stats = get_stats()
          second_cache, second_stats = get_stats()

          assert first_cache == "MISS", first_cache
          assert second_cache == "HIT", second_cache
          assert second_stats == first_stats

          print("Compose integration smoke test passed:", complaint_id)
          PY
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install kustomize
        shell: bash
        run: |
          curl -fsSLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
      - name: Install kubeconform
        shell: bash
        run: |
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes resources
        shell: bash
        run: |
          kustomize build k8s/overlays/prod > k8s-rendered.yaml
          kubeconform -strict -ignore-missing-schemas -summary k8s-rendered.yaml
